<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>JettyPod Newsletter</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        /* Reset */
        body, table, td, p, a, li { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; }

        /* Mobile */
        @media screen and (max-width: 600px) {
            .mobile-padding { padding-left: 20px !important; padding-right: 20px !important; }
            .mobile-stack { display: block !important; width: 100% !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #E8EBED; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

    <!-- Preview Text -->
    <div style="display: none; max-height: 0; overflow: hidden;">
        {{PREVIEW_TEXT}} &nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
    </div>

    <!-- Email Container -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #E8EBED;">
        <tr>
            <td align="center" style="padding: 40px 20px;">

                <!-- Content Card -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden;">

                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding: 40px 40px 30px 40px;">
                            <img src="https://jettypod.com/logo.png" alt="JettyPod" width="140" style="display: block;">
                        </td>
                    </tr>

                    <!-- Main Content -->
                    <tr>
                        <td class="mobile-padding" style="padding: 0 40px 40px 40px;">

                            <!-- Headline -->
                            <h1 style="margin: 0 0 20px 0; font-size: 24px; line-height: 32px; color: #0B2532; font-weight: 600;">
                                {{HEADLINE}}
                            </h1>

                            <!-- Body Text -->
                            <p style="margin: 0 0 20px 0; font-size: 16px; line-height: 26px; color: #333333;">
                                {{BODY_PARAGRAPH_1}}
                            </p>

                            <p style="margin: 0 0 20px 0; font-size: 16px; line-height: 26px; color: #333333;">
                                {{BODY_PARAGRAPH_2}}
                            </p>

                            <!-- Optional CTA Button -->
                            <!--
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 30px 0;">
                                <tr>
                                    <td style="background-color: #2D5A5B; border-radius: 8px;">
                                        <a href="{{CTA_URL}}" target="_blank" style="display: inline-block; padding: 14px 28px; font-size: 16px; font-weight: 600; color: #ffffff; text-decoration: none;">{{CTA_TEXT}}</a>
                                    </td>
                                </tr>
                            </table>
                            -->

                            <!-- Tip/Highlight Box (optional) -->
                            <!--
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: 25px 0; background-color: #f5f7f8; border-radius: 8px;">
                                <tr>
                                    <td style="padding: 20px;">
                                        <p style="margin: 0 0 8px 0; font-size: 14px; font-weight: 600; color: #2D5A5B; text-transform: uppercase; letter-spacing: 0.5px;">
                                            Tip of the Week
                                        </p>
                                        <p style="margin: 0; font-size: 15px; line-height: 24px; color: #333333;">
                                            {{TIP_CONTENT}}
                                        </p>
                                    </td>
                                </tr>
                            </table>
                            -->

                            <!-- Sign-off -->
                            <p style="margin: 30px 0 0 0; font-size: 16px; line-height: 26px; color: #333333;">
                                {{SIGNOFF}}
                            </p>
                            <p style="margin: 5px 0 0 0; font-size: 16px; line-height: 26px; color: #333333; font-weight: 600;">
                                {{SIGNATURE_NAME}}
                            </p>

                        </td>
                    </tr>

                </table>

                <!-- Footer -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="max-width: 600px;">
                    <tr>
                        <td align="center" style="padding: 30px 40px;">
                            <p style="margin: 0 0 10px 0; font-size: 13px; line-height: 20px; color: #7A9E9F;">
                                You're receiving this because you signed up at jettypod.com
                            </p>
                            <p style="margin: 0; font-size: 13px; line-height: 20px; color: #7A9E9F;">
                                <a href="{{UNSUBSCRIBE_URL}}" style="color: #7A9E9F; text-decoration: underline;">Unsubscribe</a>
                            </p>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
