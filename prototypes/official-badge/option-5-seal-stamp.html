<!DOCTYPE html>
<html>
<head>
    <title>Option 5: Seal Stamp</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 80px 60px;
            text-align: center;
            max-width: 800px;
        }
        .official-badge {
            display: inline-block;
            border: 3px double #2D5A5B;
            border-radius: 8px;
            padding: 20px 40px;
            position: relative;
        }
        .official-text {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #2D5A5B;
            margin-bottom: 6px;
        }
        .main-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0B2532;
        }
        .seal {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 40px;
            height: 40px;
            background: #2D5A5B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .seal svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        .label {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="official-badge">
            <div class="official-text">Official Tool</div>
            <div class="main-text">The Jetty Method</div>
            <div class="seal">
                <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
            </div>
        </div>
        <p class="label">Option 5: Certificate seal with star badge</p>
    </div>
</body>
</html>
