<!DOCTYPE html>
<html>
<head>
    <title>Option 2: Bordered Badge</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 80px 60px;
            text-align: center;
            max-width: 800px;
        }
        .official-badge {
            display: inline-block;
            border: 2px solid #2D5A5B;
            padding: 16px 32px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #2D5A5B;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .label {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="official-badge">The Official Tool of The Jetty Method</div>
        <p class="label">Option 2: Bordered badge, uppercase</p>
    </div>
</body>
</html>
