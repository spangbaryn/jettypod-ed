<!DOCTYPE html>
<html>
<head>
    <title>Option 3: Ribbon Banner</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 80px 60px;
            text-align: center;
            max-width: 800px;
        }
        .official-badge {
            display: inline-block;
            background: #2D5A5B;
            color: white;
            padding: 14px 48px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            position: relative;
        }
        .official-badge::before,
        .official-badge::after {
            content: '';
            position: absolute;
            top: 0;
            border: 22px solid #2D5A5B;
        }
        .official-badge::before {
            left: -20px;
            border-left-color: transparent;
        }
        .official-badge::after {
            right: -20px;
            border-right-color: transparent;
        }
        .label {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="official-badge">The Official Tool of The Jetty Method</div>
        <p class="label">Option 3: Ribbon banner style</p>
    </div>
</body>
</html>
