<!DOCTYPE html>
<html>
<head>
    <title>Option 1: Elegant Serif</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 80px 60px;
            text-align: center;
            max-width: 800px;
        }
        .official-badge {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.4rem;
            color: #2D5A5B;
            letter-spacing: 0.05em;
            position: relative;
            display: inline-block;
            padding: 0 40px;
        }
        .official-badge::before,
        .official-badge::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30px;
            height: 1px;
            background: #2D5A5B;
        }
        .official-badge::before {
            left: 0;
        }
        .official-badge::after {
            right: 0;
        }
        .label {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="official-badge">The Official Tool of The Jetty Method</div>
        <p class="label">Option 1: Elegant Serif with decorative lines</p>
    </div>
</body>
</html>
