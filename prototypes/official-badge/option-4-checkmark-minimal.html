<!DOCTYPE html>
<html>
<head>
    <title>Option 4: Checkmark Minimal</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 80px 60px;
            text-align: center;
            max-width: 800px;
        }
        .official-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            color: #333;
        }
        .checkmark {
            width: 24px;
            height: 24px;
            background: #2D5A5B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .checkmark svg {
            width: 14px;
            height: 14px;
            stroke: white;
            stroke-width: 3;
            fill: none;
        }
        .text {
            font-weight: 500;
        }
        .text em {
            font-style: normal;
            color: #2D5A5B;
            font-weight: 600;
        }
        .label {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="official-badge">
            <span class="checkmark">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </span>
            <span class="text">The Official Tool of <em>The Jetty Method</em></span>
        </div>
        <p class="label">Option 4: Minimal with verified checkmark</p>
    </div>
</body>
</html>
